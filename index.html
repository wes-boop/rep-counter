<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1526">
<title>Rep Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: full-bleed camera; frosted header + activity rings over it; frosted bottom sheet with controls.
   Palette: HutCrew blue horizon (midnight navy, sky, electric blue, silver). Type: Apple system font, rounded numerals. */
:root{
  --bg:#0B1526; --deep:#060D19;
  --glass:rgba(15,27,45,.62); --glass-strong:rgba(15,27,45,.82);
  --hair:rgba(214,220,228,.14); --fill:rgba(214,220,228,.10);
  --fg:#F2F5F9; --fg2:#A9B4C2;
  --sky:#8EC1F2; --blue:#3B82D6; --navy:#1F3556; --ink:#0B1526;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
main{height:100%;display:grid;grid-template-rows:1fr auto}

/* camera stage */
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#14284A 0%,var(--bg) 55%,var(--deep) 100%)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
video.mirror,canvas.mirror{transform:scaleX(-1)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--hair)}

/* header */
.head{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:20px;pointer-events:none}
.head .t{flex:1;min-width:0}
.eyebrow{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--sky)}
.title{font:700 20px/1.2 var(--sans);letter-spacing:-.01em}
.sub{font:500 12.5px/1.35 var(--sans);color:var(--fg2);margin-top:2px}
.sub b{color:var(--sky);font-weight:600}
.clock{font:600 22px var(--rounded);font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:12px;background:var(--fill)}

/* rings + count */
.rings{position:absolute;top:calc(env(safe-area-inset-top,0px) + 108px);left:max(14px,env(safe-area-inset-left));width:176px;height:176px;border-radius:50%;pointer-events:none;display:grid;place-items:center}
.rings svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round}
.rings .track{stroke:var(--fill)}
.rings .goal{stroke:url(#gSky);transition:stroke-dashoffset .4s ease}
.rings .depth{stroke:var(--blue);transition:stroke-dashoffset .12s linear}
.num{position:relative;text-align:center}
.count{font:700 64px/1 var(--rounded);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count.bump{animation:bump .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.14)}}
.ex{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-top:4px}

/* per-movement totals + toast */
.chips{position:absolute;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));bottom:44px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
.chip{position:relative;overflow:hidden;padding:7px 12px 9px;border-radius:12px;font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--fg)}
.chip small{color:var(--fg2);font-weight:500}
.chip i{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--sky);border-radius:0 2px 2px 0}
.chip.on{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky) inset}
.chip.done i{background:#7BE0A8}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;max-width:calc(100% - 32px);padding:9px 16px;border-radius:99px;font:500 13.5px var(--sans);text-align:center;pointer-events:none}
.toast:empty{display:none}

/* bottom sheet */
.sheet{position:relative;z-index:2;margin-top:-26px;border-radius:26px 26px 0 0;border-bottom:0;background:var(--glass-strong);display:grid;gap:12px;padding-block:8px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--fill)}
.row label{font:500 15px var(--sans);color:var(--fg2)}
select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--fg);font:600 16px var(--sans);text-align:right;padding-right:18px;max-width:60%;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);
  background-position:right 6px center,right 1px center;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:grid;grid-template-columns:repeat(5,1fr);padding:2px;border-radius:10px;background:var(--fill)}
.seg button{border:0;background:transparent;color:var(--fg);font:500 13.5px var(--sans);padding:8px 0;border-radius:8px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:#3A4A63;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.primary{border:0;border-radius:14px;padding:16px;font:600 17px var(--sans);color:var(--ink);cursor:pointer;background:linear-gradient(180deg,#A6CFF6,var(--sky));box-shadow:0 8px 24px rgba(59,130,214,.35)}
.primary:disabled{opacity:.45;box-shadow:none}
.tools{display:flex;justify-content:space-around}
.tool{display:grid;justify-items:center;gap:5px;border:0;background:transparent;color:var(--fg2);font:500 11.5px var(--sans);cursor:pointer}
.tool span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--fill);color:var(--fg)}
.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="false"] span{color:var(--fg2)}
button:focus-visible,select:focus-visible,.tool:focus-within span{outline:2px solid var(--sky);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
@media (prefers-reduced-motion:reduce){.count.bump{animation:none}.rings circle{transition:none}}
</style>
</head>
<body>
<main>
  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="head glass">
      <div class="t">
        <div class="eyebrow" id="modeTag">Auto-detect</div>
        <div class="title" id="wodTitle">Free workout</div>
        <div class="sub" id="wodinfo"></div>
      </div>
      <div class="clock" id="clock">0:00</div>
    </div>

    <div class="rings glass">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9E2FA"/><stop offset="1" stop-color="#8EC1F2"/></linearGradient></defs>
        <circle class="track" cx="50" cy="50" r="44" stroke-width="7"/>
        <circle class="goal" id="ringGoal" cx="50" cy="50" r="44" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <circle class="track" cx="50" cy="50" r="35" stroke-width="5"/>
        <circle class="depth" id="ringDepth" cx="50" cy="50" r="35" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      </svg>
      <div class="num">
        <div class="count" id="count" aria-live="polite">0</div>
        <div class="ex" id="exName">Push-ups</div>
      </div>
    </div>

    <div class="chips" id="totals"></div>
    <div class="toast glass" id="msg">Loading pose model…</div>
  </div>

  <div class="sheet glass">
    <div class="grab"></div>
    <div class="row">
      <label for="wod">Workout</label>
      <select id="wod"></select>
    </div>
    <div class="seg" role="group" aria-label="Exercise">
      <button id="ex-auto" data-ex="auto" aria-pressed="true">Auto</button>
      <button id="ex-pushup" data-ex="pushup" aria-pressed="false">Push</button>
      <button id="ex-pullup" data-ex="pullup" aria-pressed="false">Pull</button>
      <button id="ex-squat" data-ex="squat" aria-pressed="false">Squat</button>
      <button id="ex-situp" data-ex="situp" aria-pressed="false">Sit-up</button>
    </div>
    <button id="cam" class="primary" disabled>Start Workout</button>
    <div class="tools">
      <label class="tool"><span><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10.5l5-3v9l-5-3"/></svg></span>Video<input id="file" type="file" accept="video/*"></label>
      <button class="tool" id="reset"><span><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></span>Reset</button>
      <button class="tool" id="voice" aria-pressed="true"><span><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span><em id="voiceLbl" style="font-style:normal">Voice</em></button>
    </div>
  </div>
</main>

<script>
// If the tracker never finishes loading (old iOS, blocked download), say so instead of hanging.
setTimeout(() => { if (!window.__ready) document.getElementById("msg").textContent = "Still loading the tracker. On a weak signal try Wi-Fi; if it never loads, update iOS (needs 16.4+)."; }, 25000);
</script>
<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// Landmark ids (MediaPipe 33-point body): nose 0, shoulder 11/12, elbow 13/14, wrist 15/16, hip 23/24, knee 25/26, ankle 27/28.
// down/up are the joint angles (degrees) that mark the bottom and top of a rep.
// ponytail: fixed thresholds per exercise; tune here (or add per-user calibration) if real people miss reps.
const EXERCISES = {
  pullup: { name: "Pull-ups", short: "Pull",  joints: [[11,13,15],[12,14,16]], down: 80,  up: 145 },
  pushup: { name: "Push-ups", short: "Push",  joints: [[11,13,15],[12,14,16]], down: 100, up: 150 },
  squat:  { name: "Squats",   short: "Squat", joints: [[23,25,27],[24,26,28]], down: 110, up: 160 },
  situp:  { name: "Sit-ups",  short: "Sit-up", joints: [[11,23,25],[12,24,26]], down: 75,  up: 115 },
};

// Benchmark workouts that use only movements the camera can count (no barbells, burpees or box jumps).
// goals = total reps for time; round = reps per round (rounds = how many, cap = minutes on the clock, emom = call out each minute).
const WORKOUTS = {
  free:      { name: "Free workout" },
  murph:     { name: "Murph",      info: "1 mi run · 100 pull · 200 push · 300 squat · 1 mi run, for time", goals: { pullup: 100, pushup: 200, squat: 300 } },
  halfmurph: { name: "Half Murph", info: "½ mi run · 50 pull · 100 push · 150 squat · ½ mi run, for time",  goals: { pullup: 50, pushup: 100, squat: 150 } },
  angie:     { name: "Angie",      info: "100 pull · 100 push · 100 sit-up · 100 squat, for time", goals: { pullup: 100, pushup: 100, situp: 100, squat: 100 } },
  barbara:   { name: "Barbara",    info: "5 rounds: 20 pull · 30 push · 40 sit-up · 50 squat, 3 min rest between", round: { pullup: 20, pushup: 30, situp: 40, squat: 50 }, rounds: 5 },
  cindy:     { name: "Cindy",      info: "20 min, as many rounds as possible: 5 pull · 10 push · 15 squat", round: { pullup: 5, pushup: 10, squat: 15 }, cap: 20 },
  chelsea:   { name: "Chelsea",    info: "Every minute for 30 min: 5 pull · 10 push · 15 squat", round: { pullup: 5, pushup: 10, squat: 15 }, cap: 30, emom: true },
};
const goalsOf = w => w.goals || (w.round && w.rounds ? Object.fromEntries(Object.entries(w.round).map(([k, n]) => [k, n * w.rounds])) : null);
const roundsDone = (w, reps) => w.round ? Math.min(...Object.keys(w.round).map(k => Math.floor(reps[k] / w.round[k]))) : null;

// Pure rep counter: feed angles, it counts one rep per full down→up cycle (angle drops below `down`, then rises above `up`).
function makeCounter(cfg) {
  let phase = "up", reps = 0;
  return {
    step(angle) {
      if (angle == null) return { reps, phase };
      if (phase === "up" && angle < cfg.down) phase = "down";
      else if (phase === "down" && angle > cfg.up) { phase = "up"; reps++; }
      return { reps, phase };
    },
    get reps() { return reps; },
  };
}

function angleAt(a, b, c) {
  const r = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
  const d = Math.abs(r * 180 / Math.PI);
  return d > 180 ? 360 - d : d;
}

// Use whichever side of the body the camera sees best.
function bestAngle(lm, joints) {
  let best = null, bestVis = 0.5;
  for (const [a, b, c] of joints) {
    const vis = Math.min(lm[a].visibility ?? 1, lm[b].visibility ?? 1, lm[c].visibility ?? 1);
    if (vis > bestVis) { bestVis = vis; best = angleAt(lm[a], lm[b], lm[c]); }
  }
  return best;
}

// Guess the exercise from body position:
//  legs lying flat (hip and ankle at about the same height) → floor work: straight knees = push-up, bent knees = sit-up
//  upright → hands above shoulders = pull-up, otherwise squat
// ponytail: simple geometry rules; a trained classifier would handle odd camera angles better.
function classify(lm, aspect = 1) {
  const mid = (i, j) => ({ x: (lm[i].x + lm[j].x) / 2, y: (lm[i].y + lm[j].y) / 2 });
  const hip = mid(23, 24), ankle = mid(27, 28), wrist = mid(15, 16), shoulder = mid(11, 12);
  const dx = Math.abs(ankle.x - hip.x) * aspect, dy = Math.abs(ankle.y - hip.y);
  if (dx > dy * 1.5) {
    const knee = Math.max(angleAt(lm[23], lm[25], lm[27]), angleAt(lm[24], lm[26], lm[28]));
    return knee > 140 ? "pushup" : "situp";
  }
  // hands clearly above shoulders = hanging from a bar (holds even with chin over the bar)
  return wrist.y < shoulder.y - 0.03 ? "pullup" : "squat";
}

// Self-check: run with ?test in the URL.
if (location.search.includes("test")) {
  const c = makeCounter(EXERCISES.pushup);
  for (const a of [170,160,120,95,90,110,155,165, 170,98,92,151, 160,140,99,120,149,152, 130,105]) c.step(a);
  const P = (x, y) => ({ x, y, visibility: 1 });
  const body = o => { const lm = Array.from({ length: 33 }, () => P(0.5, 0.5)); for (const k in o) lm[k] = o[k]; return lm; };
  // standing, arms down → squat; arms overhead → pull-up; plank → push-up; lying, knees bent → sit-up
  const stand = { 0: P(.5,.1), 11: P(.45,.2), 12: P(.55,.2), 15: P(.45,.5), 16: P(.55,.5), 23: P(.47,.5), 24: P(.53,.5), 25: P(.47,.7), 26: P(.53,.7), 27: P(.47,.9), 28: P(.53,.9) };
  const hang  = { ...stand, 15: P(.45,.02), 16: P(.55,.02) };
  const plank = { 0: P(.15,.6), 11: P(.2,.6), 12: P(.2,.6), 15: P(.2,.8), 16: P(.2,.8), 23: P(.5,.62), 24: P(.5,.62), 25: P(.68,.64), 26: P(.68,.64), 27: P(.85,.66), 28: P(.85,.66) };
  const situp = { 0: P(.15,.7), 11: P(.2,.72), 12: P(.2,.72), 15: P(.3,.7), 16: P(.3,.7), 23: P(.45,.8), 24: P(.45,.8), 25: P(.6,.6), 26: P(.6,.6), 27: P(.75,.8), 28: P(.75,.8) };
  const got = [stand, hang, plank, situp].map(o => classify(body(o)));
  const cindyRounds = roundsDone(WORKOUTS.cindy, { pullup: 11, pushup: 20, squat: 30 });  // 2 full rounds
  const barbaraGoal = goalsOf(WORKOUTS.barbara).squat;                                     // 5 × 50
  const ok = c.reps === 3 && got.join() === "squat,pullup,pushup,situp" && cindyRounds === 2 && barbaraGoal === 250;
  console.log("self-check:", ok ? "PASS" : "FAIL", { reps: c.reps, got });
  window.__selftest = ok ? "PASS" : "FAIL";
}

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
let mode = "auto", current = "pushup", landmarker, running = false, voice = true, wod = WORKOUTS.free;
let counters, smooth = null, guess = null, guessFrames = 0, startedAt = null, finished = false, lastMinute = 0;
const SWITCH_FRAMES = 20; // a new position must hold ~2/3 s before auto mode switches exercise

function say(text) {
  if (!voice || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(String(text)));
}

const repsMap = () => Object.fromEntries(Object.keys(EXERCISES).map(k => [k, counters[k].reps]));
const wodKeys = () => Object.keys(goalsOf(wod) || wod.round || EXERCISES);
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

function renderTotals() {
  const goals = goalsOf(wod);
  $("totals").innerHTML = wodKeys().map(k => {
    const n = counters[k].reps, goal = goals?.[k];
    const cls = (k === current ? "on" : "") + (goal && n >= goal ? " done" : "");
    return `<span class="chip glass ${cls}" style="--p:${goal ? Math.min(1, n / goal) : 0}"><i></i>${EXERCISES[k].short} ${n}${goal ? "<small>/" + goal + "</small>" : ""}</span>`;
  }).join("");
  const r = roundsDone(wod, repsMap());
  const roundText = r == null ? "" : wod.rounds ? ` · <b>Round ${Math.min(r + 1, wod.rounds)} of ${wod.rounds}</b>` : ` · <b>${r} rounds</b>`;
  $("wodTitle").textContent = wod.name;
  $("wodinfo").innerHTML = (wod.info || "Pick a workout, or just start moving") + roundText;
}

function render(phase, angle) {
  const e = EXERCISES[current], n = counters[current].reps, goal = goalsOf(wod)?.[current];
  $("count").textContent = n;
  $("exName").textContent = e.name;
  $("modeTag").textContent = mode === "auto" ? "Auto-detect" : "Manual";
  // outer ring = progress to this movement's goal; inner ring = how deep you are in the current rep
  const depth = angle == null ? 0 : Math.min(1, Math.max(0, (e.up - angle) / (e.up - e.down)));
  $("ringGoal").style.strokeDashoffset = goal ? 1 - Math.min(1, n / goal) : 1;
  $("ringDepth").style.strokeDashoffset = 1 - depth;
  renderTotals();
}

function resetAll() {
  counters = Object.fromEntries(Object.keys(EXERCISES).map(k => [k, makeCounter(EXERCISES[k])]));
  smooth = null; guess = null; guessFrames = 0; finished = false; lastMinute = 0;
  startedAt = running ? performance.now() : null;
  $("clock").textContent = wod.cap ? fmt(wod.cap * 60) : "0:00";
  render("up", null);
}

function switchTo(key) {
  if (key === current) return;
  current = key; smooth = null;
  say(EXERCISES[key].name);
}

function setMode(m) {
  mode = m;
  if (m !== "auto") switchTo(m);
  document.querySelectorAll("[data-ex]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ex === m));
  render("up", null);
}

$("wod").innerHTML = Object.entries(WORKOUTS).map(([k, w]) => `<option value="${k}">${w.name}</option>`).join("");
$("wod").onchange = e => { wod = WORKOUTS[e.target.value]; resetAll(); };
document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => setMode(b.dataset.ex));
$("reset").onclick = resetAll;
$("voice").onclick = () => { voice = !voice; $("voice").setAttribute("aria-pressed", voice); $("voiceLbl").textContent = voice ? "Voice" : "Muted"; };

// Clock: counts up, or down from the time cap. Time's up or all reps done = workout over, counting stops.
setInterval(() => {
  if (startedAt == null || finished) return;
  const s = Math.floor((performance.now() - startedAt) / 1000);
  if (wod.cap) {
    const left = Math.max(0, wod.cap * 60 - s);
    $("clock").textContent = fmt(left);
    const m = Math.floor(s / 60);
    if (wod.emom && m > lastMinute && left > 0) { lastMinute = m; say(`Minute ${m + 1}. Go`); }
    if (left === 0) { finished = true; const r = roundsDone(wod, repsMap()); say(`Time! ${r} rounds`); }
  } else {
    $("clock").textContent = fmt(s);
  }
}, 500);

function checkDone() {
  const goals = goalsOf(wod);
  if (!goals || finished) return;
  if (Object.entries(goals).every(([k, n]) => counters[k].reps >= n)) {
    finished = true;
    say(`${wod.name} done! ${$("clock").textContent.replace(":", " minutes ")} seconds`);
  }
}

function loop() {
  if (!running) return;
  if (video.readyState >= 2) {
    if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const res = landmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const lm = res.landmarks?.[0];
    if (lm) {
      const draw = new DrawingUtils(ctx);
      draw.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "rgba(142,193,242,.9)", lineWidth: 5 });
      draw.drawLandmarks(lm, { color: "#D6DCE4", radius: 3 });

      if (mode === "auto") {
        const g = classify(lm, video.videoWidth / video.videoHeight);
        guessFrames = g === guess ? guessFrames + 1 : 1; guess = g;
        // only switch to movements that are in the chosen workout
        if (guessFrames >= SWITCH_FRAMES && wodKeys().includes(g)) switchTo(g);
      }

      const raw = bestAngle(lm, EXERCISES[current].joints);
      // light smoothing so jitter at the threshold doesn't double-count
      smooth = raw == null ? smooth : smooth == null ? raw : smooth * 0.6 + raw * 0.4;
      const before = counters[current].reps;
      const { phase } = finished ? { phase: "up" } : counters[current].step(raw == null ? null : smooth);
      const after = counters[current].reps;
      if (after !== before) {
        const goal = goalsOf(wod)?.[current];
        say(goal && after === goal ? `${after}. ${EXERCISES[current].name} done!` : after);
        const el = $("count"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
        checkDone();
      }
      render(phase, smooth);
      $("msg").textContent = "";
    } else {
      $("msg").textContent = "Step back so your whole body is in frame";
    }
  }
  requestAnimationFrame(loop);
}

function start(mirror) {
  video.classList.toggle("mirror", mirror); canvas.classList.toggle("mirror", mirror);
  if (!running) { running = true; resetAll(); requestAnimationFrame(loop); }
}

$("cam").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 }, audio: false });
    video.srcObject = stream; await video.play(); start(true);
    $("msg").textContent = "Prop your phone up and step back"; $("cam").textContent = "Camera On";
  } catch (err) {
    $("msg").textContent = `Camera didn't start (${err?.name || err}). In Safari: aA menu → Website Settings → Camera → Allow.`;
  }
};

$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  video.src = URL.createObjectURL(f); video.loop = false; await video.play(); start(false);
};

resetAll();

try {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = delegate => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate,
    },
    runningMode: "VIDEO", numPoses: 1,
  });
  // GPU fails on some iPhones; fall back to CPU
  try { landmarker = await PoseLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(fileset, opts("CPU")); }
  $("cam").disabled = false;
  $("msg").textContent = "Pick a workout, then tap Start";
  window.__ready = true;
} catch (err) {
  $("msg").textContent = "Couldn't load the pose model: " + (err?.message || err);
  console.error(err);
}
</script>
</body>
</html>
